# M = Read first, P = Less urgent, N = omit. These examples are prompt/eval
# anchors; they are stronger evidence than superficial title or category hits.

[[calibration]]
arxiv_id = "2609.04006"
title = "Quenched complexity of marginal states in the Sherrington--Kirkpatrick spin glass"
label = "M"
reason = "Quenched SK complexity and replica-symmetry breaking directly match the permanent center and September focus."
signals = ["quenched complexity", "spin glass", "replica symmetry breaking", "Parisi equilibrium"]

[[calibration]]
arxiv_id = "2609.03111"
title = "Large deviations for linear regressions"
label = "M"
reason = "The generic title hides a zero-temperature replica calculation for a learning problem; substantive method evidence must override title impressions."
signals = ["linear regression", "zero-temperature replica method", "large deviations", "teacher coefficients"]

[[calibration]]
arxiv_id = "2602.06065"
title = "Deep networks learn to parse uniform-depth context-free languages from local statistics"
label = "M"
reason = "A substantive theoretical result about what deep networks learn belongs in the high-priority learning-theory branch."
signals = ["deep-network theory", "representation learning", "context-free languages", "local statistics"]

[[calibration]]
arxiv_id = "2609.03618"
title = "Spectral properties of deterministic matrices multiplied by rotationally invariant random non-Hermitian ensembles"
label = "P"
reason = "Technically strong random-matrix work is adjacent, but it lacks a direct connection to current learning or many-body questions."
signals = ["random matrices", "non-Hermitian spectra", "rotational invariance"]

[[calibration]]
arxiv_id = "2609.03193"
title = "Generative Nested Sampling of Atomistic Thermodynamic Landscapes"
