# Human-editable research profile for the arXiv digest.
#
# Cluster weights are permanent preferences on a 0.0-1.0 scale. Monthly focus
# entries temporarily multiply the relevant cluster and phrase evidence. The
# vocabulary is intentionally broad: it is used for retrieval and as evidence
# for semantic ranking, never as a hard keyword gate.

[profile]
name = "Aniket"
version = 1
permanent_center = [
  "statistical physics of learning",
  "disordered systems",
  "theoretical neuroscience and associative memory",
]
ranking_principle = "Judge substantive methods and results from the abstract; titles, categories, authors, and phrases are supporting evidence rather than gates."

[models]
ranker = "gpt-5.6-luna"
ranker_reasoning_effort = "low"
embedding = "text-embedding-3-small"
summary_sentences_min = 3
summary_sentences_max = 4

[delivery]
recipient = "aniketdeshh@gmail.com"
sender = "aniketdeshh@gmail.com"
timezone = "America/Chicago"
hour = 7
minute = 7
weekdays = ["monday", "tuesday", "wednesday", "thursday", "friday"]
max_total = 15
max_less_urgent = 3
send_on_empty = false

[retrieval]
lookback_hours = 72
max_results = 2000
llm_limit = 48
rank_batch_size = 24
include_revisions = true
categories = [
  "cs.LG",
  "stat.ML",
  "cs.AI",
  "cs.CL",
  "quant-ph",
  "cond-mat.stat-mech",
  "cond-mat.dis-nn",
  "cond-mat.str-el",
  "cond-mat.quant-gas",
  "physics.comp-ph",
  "physics.chem-ph",
  "physics.bio-ph",
  "math.NA",
  "cs.NA",
  "math-ph",
  "cs.IT",
  "math.IT",
  "q-bio.NC",
  "nlin.AO",
  "nlin.CD",
]

[selection]
must_read_min_score = 0.78
less_urgent_min_score = 0.45
minimum_confidence = 0.45
pad_to_target = false
deduplicate_by_base_arxiv_id = true
material_revision_min_score = 0.72
max_per_cluster_before_diversity_penalty = 5

[ranking]
semantic_weight = 0.48
taxonomy_weight = 0.18
monthly_focus_weight = 0.16
zotero_weight = 0.08
title_phrase_multiplier = 1.20
abstract_phrase_multiplier = 1.00
legacy_numerical_linear_algebra_multiplier = 0.30
classify_fit_as = ["physics_of_learning", "physics_inspired_ml", "ml_for_physics", "other"]

[quantum_direction]
promote = [
  "quantum many-body theory",
  "many-body simulation",
  "electronic structure",
  "strongly correlated systems",
  "tensor-network quantum states",
  "DMRG",
  "PEPS",
  "fermionic tensor networks",
  "machine learning for many-body physics",
]
downweight = [
  "generic randomized numerical linear algebra",
  "generic matrix sketching",
  "generic randomized SVD",
]
bridge_exceptions = [
  "tensor-network contraction",
  "tensor eigensolver",
  "DMRG eigensolver",
  "many-body simulation",
  "electronic-structure solver",
]

[bridges]
queries = [
  "statistical mechanics + neural network",
  "replica method + learning",
  "cavity method + data attribution",
  "spin glass + transformer",
  "Potts model + attention",
  "singular learning theory + tensor network",
  "local learning coefficient + interpretability",
  "tensor network + transformer",
  "tensor decomposition + mechanistic interpretability",
  "information geometry + representation learning",
  "quantum geometric tensor + MPS",
  "classical shadows + quantum chemistry",
